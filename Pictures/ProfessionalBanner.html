<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTMusicWP Premium Banner</title>
    <!-- Inter & Montserrat Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5e5e5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .banner-container {
            width: 1280px;
            height: 640px;
            position: relative;
            background: linear-gradient(135deg, #F0FDF4 0%, #D1FAE5 100%);
            overflow: hidden;
        }

        /* Ambient Background Blobs for Depth */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: #34d399; /* Light emerald */
            top: -200px;
            right: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #60a5fa; /* Light blue for contrast */
            bottom: -150px;
            left: -150px;
            opacity: 0.3;
        }

        /* Container cố định chiều rộng ở giữa để ép Text và Phone lại gần nhau */
        .content {
            width: 1020px; 
            height: 100%;
            position: relative;
            margin: 0 auto;
            z-index: 1; /* Bring above blobs */
        }

        /* Text Group căn giữa theo chiều dọc */
        .left-panel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            display: flex;
            align-items: center;
            gap: 32px; 
        }
        
        .logo {
            width: 140px; 
            height: 140px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0,0,0,0.08); /* Tăng chiều sâu bóng logo */
            background-color: #000;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 72px; 
            font-weight: 600; /* Semi-Bold cho thanh thoát */
            color: #0f172a; 
            margin-bottom: 12px;
            letter-spacing: -1.5px;
            text-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }
        
        h1 span {
            color: #10b981;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #334155;
            line-height: 1.5;
            max-width: 400px;
        }

        /* Phone bám sát mép dưới (Grounded) */
        .right-panel {
            position: absolute;
            bottom: -30px; /* Cho điện thoại tràn một chút xuống dưới mép banner */
            right: 0;
        }

        .phone {
            position: relative;
            z-index: 2;
            height: 580px; 
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Ảnh bám đáy */
        }
        
        .phone img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(-25px 25px 50px rgba(0,0,0,0.3)); /* Tăng bóng đổ nghiêng nhẹ sang trái để tạo chiều sâu */
        }
        
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Background Blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <div class="content">
            
            <div class="left-panel">
                <img src="../YTMusicWP/Assets/Logo.scale-240.png" class="logo" alt="Logo">
                <div class="text-group">
                    <h1>YTMusic<span>WP</span></h1>
                    <p class="subtitle">Feel free when playing YouTube Music on Windows Phone 8.1</p>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="phone">
                    <img src="emulator-transparent.png" alt="Emulator Snapshot">
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
